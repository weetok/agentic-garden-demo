<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agentic Garden — Weekly Advice</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <h1>Agentic Garden</h1>
      <nav class="tabs" role="tablist" aria-label="Dashboard views">
        <button class="tab" role="tab" aria-selected="true" aria-controls="panel-overview" id="tab-overview" data-tab="overview">Overview</button>
        <button class="tab" role="tab" aria-selected="false" aria-controls="panel-trends" id="tab-trends" data-tab="trends">Trends</button>
        <button class="tab" role="tab" aria-selected="false" aria-controls="panel-flow" id="tab-flow" data-tab="flow">Flow</button>
        <button class="tab" role="tab" aria-selected="false" aria-controls="panel-briefing" id="tab-briefing" data-tab="briefing">Briefing</button>
      </nav>
    </header>

    <main>
      <section class="panel" id="panel-overview" role="tabpanel" aria-labelledby="tab-overview">
        <div class="metric-cards" id="metric-cards">
          <div class="metric-card">
            <span class="metric-label">Temperature</span>
            <span class="metric-value" data-metric="temperature_c">–</span>
            <span class="metric-unit">°C</span>
          </div>
          <div class="metric-card">
            <span class="metric-label">Humidity</span>
            <span class="metric-value" data-metric="humidity_pct">–</span>
            <span class="metric-unit">%</span>
          </div>
          <div class="metric-card">
            <span class="metric-label">Wind speed</span>
            <span class="metric-value" data-metric="wind_speed_ms">–</span>
            <span class="metric-unit">m/s</span>
          </div>
          <div class="metric-card">
            <span class="metric-label">Rain (7d)</span>
            <span class="metric-value" data-metric="rain_7d_mm">–</span>
            <span class="metric-unit">mm</span>
          </div>
          <div class="metric-card">
            <span class="metric-label">ET (7d)</span>
            <span class="metric-value" data-metric="et_7d_mm">–</span>
            <span class="metric-unit">mm</span>
          </div>
        </div>

        <div class="overview-grid">
          <div class="panel-box" id="bed-map">
            <h2>Bed map</h2>
            <div id="bed-map-svg" class="bed-map-svg-wrap"></div>
            <div class="bed-map-legend">
              <span class="legend-item"><span class="legend-swatch legend-ok"></span>OK</span>
              <span class="legend-item"><span class="legend-swatch legend-watch"></span>Watch</span>
              <span class="legend-item"><span class="legend-swatch legend-act"></span>Act now</span>
            </div>
          </div>
          <div class="panel-box" id="advice-card">
            <h2>Advice</h2>
            <div id="advice-content"></div>
          </div>
        </div>
      </section>

      <section class="panel" id="panel-trends" role="tabpanel" aria-labelledby="tab-trends" hidden>
        <div class="panel-box" id="trends-card">
          <h2>Water balance — cumulative ET vs rainfall</h2>
          <div class="trends-chart-wrap">
            <canvas id="trends-chart"></canvas>
          </div>
          <p class="trends-note" id="trends-note"></p>
        </div>
      </section>

      <section class="panel" id="panel-flow" role="tabpanel" aria-labelledby="tab-flow" hidden>
        <p class="placeholder">Data-flow animation arrives in Evening 2 (block 2.4).</p>
      </section>

      <section class="panel" id="panel-briefing" role="tabpanel" aria-labelledby="tab-briefing" hidden>
        <div class="panel-box briefing" id="briefing-content"></div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
